<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#0a0d12" />
  <title>Счётчик кругов — Трек & Поле</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-0:#0a0d12; --bg-1:#10151c; --bg-2:#161d26; --line:#232c38;
      --text:#e8edf3; --muted:#8291a3;
      --accent:#ff7a1a; --accent-ink:#1a0f04; --accent-dim:rgba(255,122,26,.28);
      --good:#33d17a; --bad:#ff5470;
      --good-dim:rgba(51,209,122,.28); --bad-dim:rgba(255,84,112,.28);
      --bg-grad-a:#0b0f15; --bg-grad-b:#080b0f;
      --noise-opacity:.018; --radial-accent-opacity:.10;
      --counter-grad-a:#1b232e; --counter-grad-b:#0c1117;
      --dashed-border:#2b3542; --hover-border:#3a4655;
      --shadow-color:rgba(0,0,0,.7); --shadow-color-soft:rgba(0,0,0,.65);
      --backdrop:rgba(4,6,9,.62);
      --font-display:'Oswald',sans-serif; --font-digits:'Bebas Neue',sans-serif; --font-body:'Inter',system-ui,sans-serif;
      color-scheme:dark;
    }
    :root[data-theme="light"] {
      --bg-0:#f3f5f8; --bg-1:#ffffff; --bg-2:#eef1f5; --line:#dbe1e8;
      --text:#1a212c; --muted:#5c6773;
      --accent:#e8690f; --accent-ink:#ffffff; --accent-dim:rgba(232,105,15,.14);
      --good:#1a9a5a; --bad:#d8264a;
      --good-dim:rgba(26,154,90,.22); --bad-dim:rgba(216,38,74,.22);
      --bg-grad-a:#eef1f6; --bg-grad-b:#e3e8ee;
      --noise-opacity:.035; --radial-accent-opacity:.07;
      --counter-grad-a:#ffffff; --counter-grad-b:#eef1f6;
      --dashed-border:#c7cedb; --hover-border:#aab4c2;
      --shadow-color:rgba(30,41,59,.12); --shadow-color-soft:rgba(30,41,59,.09);
      --backdrop:rgba(15,20,28,.4);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{-webkit-text-size-adjust:100%}
    *{-webkit-tap-highlight-color:transparent}
    body{
      margin:0;color:var(--text);font:15px/1.5 var(--font-body);
      background:
        repeating-linear-gradient(135deg, rgba(127,127,127,var(--noise-opacity)) 0 2px, transparent 2px 46px),
        radial-gradient(circle at 50% -10%, rgba(255,122,26,var(--radial-accent-opacity)), transparent 55%),
        linear-gradient(180deg,var(--bg-grad-a),var(--bg-0) 25%,var(--bg-grad-b));
      background-attachment:fixed;
      transition:background-color .3s ease,color .3s ease;
    }
    .wrap{max-width:980px;margin:0 auto;padding:16px 18px 60px}

    .site-header{text-align:center;margin-bottom:26px;padding-top:58px}
    .kicker{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.3em;font-size:11px;color:var(--accent);font-weight:600}
    h1{margin:8px 0 4px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:32px}
    .subtitle{margin:0;color:var(--muted);font-size:13.5px}
    .lane-divider{height:5px;margin:20px auto 0;max-width:200px;border-radius:3px;opacity:.6;
      background:repeating-linear-gradient(115deg, var(--accent) 0 10px, transparent 10px 20px)}

    .panel{background:var(--bg-1);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:20px;
      padding:22px;box-shadow:0 24px 60px -28px var(--shadow-color);transition:border-top-color .3s ease,background-color .3s ease,box-shadow .3s ease}

    .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .current-tab{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:15px;
      text-transform:uppercase;letter-spacing:.03em;color:var(--text)}
    .current-tab svg{color:var(--accent);flex:none}
    .conn-dot{width:9px;height:9px;border-radius:50%;background:#8b96a5;flex:none;transition:.2s;margin-left:auto}
    .conn-dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
    .conn-dot.err{background:var(--bad);box-shadow:0 0 8px var(--bad)}

    .icon-btn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);
      color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;touch-action:manipulation}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
    .icon-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

    .top-fixed-left{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);
      left:calc(env(safe-area-inset-left, 0px) + 14px);z-index:45;display:flex;align-items:center;gap:10px}
    .top-fixed-right{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);
      right:calc(env(safe-area-inset-right, 0px) + 14px);z-index:45;display:flex;align-items:center;gap:10px}
    .fixed-label{height:42px;flex:none;display:flex;align-items:center;padding:0 14px;border-radius:12px;
      border:1px solid var(--line);background:var(--bg-2);color:var(--text);
      font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
      box-shadow:0 10px 26px -14px var(--shadow-color);user-select:none}
    @media (max-width:520px){
      .top-fixed-left{top:calc(env(safe-area-inset-top, 0px) + 10px);left:calc(env(safe-area-inset-left, 0px) + 10px);gap:7px}
      .top-fixed-right{top:calc(env(safe-area-inset-top, 0px) + 10px);right:calc(env(safe-area-inset-right, 0px) + 10px);gap:7px}
      .icon-btn{width:38px;height:38px}
      .fixed-label{height:38px;padding:0 10px;font-size:11px;letter-spacing:.03em}
      .site-header{padding-top:50px}
    }
    @media (max-width:340px){ .fixed-label{display:none} }

    .timer{
      font-family:var(--font-digits);font-weight:400;text-align:center;
      font-size:clamp(46px,14vw,84px);letter-spacing:.02em;line-height:1;
      color:var(--accent);text-shadow:0 0 26px var(--accent-dim);
      margin-bottom:6px;
    }

    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px;margin-bottom:22px}
    .controls button{
      min-height:46px;padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
      font-family:var(--font-display);font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;
      cursor:pointer;transition:.15s;touch-action:manipulation}
    .controls button:hover{border-color:var(--hover-border)}
    .controls button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .controls button.primary:hover{filter:brightness(1.08)}
    .controls button.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
    .controls button.warn:hover{background:rgba(255,84,112,.1)}
    .controls button:active{transform:translateY(1px)}

    .manual-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
    @media (max-width:520px){.manual-form{grid-template-columns:1fr}}

    .hint{font-size:12px;color:var(--muted);margin-top:8px}

    /* ---- Переключатель "Ввод данных" / "Контроль" ---- */
    .view-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 4px}
    .view-switch button{
      padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);
      font-family:var(--font-display);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;
      cursor:pointer;transition:.15s;touch-action:manipulation}
    .view-switch button:hover{border-color:var(--hover-border)}
    .view-switch button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

    label{display:block;text-align:center;font-family:var(--font-display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    input[type="text"],input[type="number"]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-body);font-weight:500;
      font-size:16px; /* >=16px — иначе Safari на iOS зумит страницу при фокусе */
      transition:.15s;touch-action:manipulation}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

    .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:24px}
    @media (min-width:900px){ .lanes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }

    .lane-card{position:relative;overflow:hidden;
      border-radius:16px;border:1px solid var(--line);padding:14px;
      background:radial-gradient(120% 140% at 50% -10%, var(--counter-grad-a) 0%, var(--counter-grad-b) 65%);
      transition:border-color .15s ease,box-shadow .15s ease}
    .lane-card::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(180deg, rgba(127,127,127,.025) 0 2px, transparent 2px 4px)}
    .lane-card.running{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .lane-card.last-lap{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-dim)}
    .lane-card.finished{border-color:var(--good);box-shadow:0 0 0 3px var(--good-dim)}
    @keyframes flashGlow{
      0%{box-shadow:0 0 0 0 var(--accent-dim)}
      60%{box-shadow:0 0 0 8px transparent}
      100%{box-shadow:none}
    }
    .lane-card.flash{animation:flashGlow .5s ease-out}

    /* Номер (манишка) — главный элемент карточки: по нему судья находит бегуна на дорожке */
    .bib-input{
      position:relative;display:block;width:100%;
      text-align:center;font-family:var(--font-digits);
      font-size:clamp(38px,13vw,56px);line-height:1;letter-spacing:.03em;
      padding:8px 4px 6px;margin-bottom:8px;
      border-radius:12px;border:2px solid var(--line);background:var(--bg-2);color:var(--text)}
    .bib-input::placeholder{color:var(--muted);opacity:.45}
    .bib-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .lane-card.running .bib-input{border-color:var(--accent);background:var(--accent-dim)}
    .lane-card.last-lap .bib-input{border-color:var(--bad);background:var(--bad-dim)}
    .lane-card.finished .bib-input{border-color:var(--good);background:var(--good-dim)}

    .lane-meta{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .eyebrow{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .status-pill{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
      padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--bg-2)}
    .status-pill.running{color:var(--accent);background:var(--accent-dim)}
    .status-pill.last-lap{color:var(--bad);background:var(--bad-dim)}
    .status-pill.finished{color:var(--good);background:var(--good-dim)}

    .lane-time{position:relative;text-align:center;font-family:var(--font-digits);font-size:clamp(20px,6vw,28px);
      color:var(--accent);text-shadow:0 0 14px var(--accent-dim);margin:2px 0 10px;line-height:1}

    .athlete-input{position:relative;display:block;width:100%;height:40px;padding:0 8px;border-radius:10px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-body);
      font-size:16px; /* >=16px — иначе Safari на iOS зумит страницу при фокусе */
      text-align:center;overflow:hidden;text-overflow:ellipsis}

    .lane-footer{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:10px;
      color:var(--muted);font-size:10px;line-height:1.3}
    .lane-hint{flex:1;text-align:left;margin-right:8px}
    .undo{flex-shrink:0;min-height:34px;min-width:42px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-display);font-weight:700;font-size:12px;
      cursor:pointer;touch-action:manipulation}
    .undo:hover{border-color:var(--hover-border)}

    .finish-ribbon{position:absolute;top:12px;right:-32px;width:120px;transform:rotate(45deg);
      background:linear-gradient(180deg,var(--good),#1a9a5a);color:#04150c;font-family:var(--font-display);
      font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:4px 0;
      box-shadow:0 4px 10px rgba(0,0,0,.35)}

    /* ---- Режим "Контроль": крупные ячейки только с номером и кругами, без полей ввода ---- */
    .lanes.control-mode{grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px}
    @media (min-width:900px){ .lanes.control-mode{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))} }
    .ctrl-card{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:112px;padding:10px 6px;-webkit-user-select:none;user-select:none}
    .ctrl-card:active{transform:scale(.97)}
    .ctrl-bib{position:relative;font-family:var(--font-digits);font-size:clamp(34px,11vw,50px);line-height:1;color:var(--text)}
    .ctrl-laps{position:relative;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);margin-top:6px}
    .ctrl-laps b{color:var(--accent);font-size:19px;font-weight:700}
    .lane-card.finished .ctrl-laps b{color:var(--good)}
    .lane-card.last-lap .ctrl-laps b{color:var(--bad)}

    .saved{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
    .saved-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
    .saved-title{font-family:var(--font-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-display);font-weight:600;font-size:12.5px;
      text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:.15s;touch-action:manipulation}
    .btn:hover{border-color:var(--hover-border)}
    .saved-list{display:grid;gap:10px}
    .saved-item{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
      padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2)}
    .saved-meta{font-family:var(--font-body);font-weight:600;font-size:13px}
    .saved-buttons{display:flex;gap:8px}

    .toast-container{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
      display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
    .toast{pointer-events:auto;padding:12px 16px;border-radius:12px;font-family:var(--font-body);
      font-size:13.5px;font-weight:500;text-align:center;background:var(--bg-1);border:1px solid var(--line);
      color:var(--text);box-shadow:0 16px 40px -14px var(--shadow-color-soft);
      opacity:0;transform:translateY(14px);transition:opacity .25s ease,transform .25s ease}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.success{border-color:var(--good);color:var(--good)}
    .toast.error{border-color:var(--bad);color:var(--bad)}

    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    /* ===== Компактный режим для телефонов ===== */
    @media (max-width:480px){
      .wrap{padding:10px 12px 40px}
      h1{font-size:26px}
      .panel{padding:16px;border-radius:16px}
      .timer{font-size:clamp(36px,15vw,54px)}
      .controls{gap:6px;margin-bottom:16px}
      .controls button{min-height:40px;padding:0 8px;font-size:11.5px}
      .lanes{gap:8px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
      .lanes.control-mode{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
      .lane-card{padding:10px}
      .bib-input{font-size:clamp(32px,15vw,44px);padding:6px 4px 4px;margin-bottom:6px}
      .lane-time{font-size:clamp(16px,6vw,22px);margin:2px 0 8px}
      .athlete-input{height:36px}
      .undo{min-height:30px;min-width:38px;padding:4px 8px}
      .ctrl-card{min-height:88px;padding:6px 4px}
      .ctrl-bib{font-size:clamp(26px,13vw,38px)}
      .ctrl-laps{font-size:12.5px;margin-top:4px}
      .ctrl-laps b{font-size:15px}
      .view-switch button{font-size:11px;padding:9px 6px}
    }

    /* ===== Фолбэки для старых WebKit без CSS Grid / gap (Safari iOS ≤ 9.3, iPad 2) ===== */
    @supports not (display: grid) {
      .controls, .manual-form, .lanes, .saved-list, .view-switch {
        display:flex; flex-wrap:wrap; margin:-5px;
      }
      .controls > *, .manual-form > *, .lanes > *, .view-switch > * { flex:1 1 160px; margin:5px; }
      .saved-list > * { flex:1 1 100%; margin:5px; }
    }
    @supports not (gap: 1px) {
      .top-fixed-left > *, .top-fixed-right > * { margin:0 5px; }
      .current-tab svg { margin-right:8px; }
      .saved-header > * { margin:0 4px; }
      .saved-buttons > * { margin:0 4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="site-header">
      <div class="kicker">Судейский пункт</div>
      <h1>Счётчик кругов</h1>
      <p class="subtitle">Хронометраж и учёт кругов — трек и поле</p>
      <div class="lane-divider"></div>
    </div>

    <div class="panel">
      <div class="top-bar">
        <div class="current-tab">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="12" y2="9"/><line x1="9" y1="3" x2="15" y2="3"/></svg>
          <span>Секундомер</span>
        </div>
        <span class="conn-dot" id="connDot" title="Статус последней отправки в Google"></span>
      </div>

      <div class="timer" id="timer">00:00:00</div>

      <div class="controls">
        <button id="startBtn" class="primary">Старт</button>
        <button id="pauseBtn">Пауза</button>
        <button id="stopBtn" class="warn">Стоп</button>
        <button id="resetBtn">Сброс</button>
      </div>

      <div class="manual-form">
        <div>
          <label for="totalLaps">Круги</label>
          <input type="number" id="totalLaps" min="1" value="5" />
        </div>
        <div>
          <label for="raceName">Название забега</label>
          <input type="text" id="raceName" placeholder="Например: Финал 800м" />
        </div>
      </div>

      <div class="view-switch">
        <button id="setupTabBtn" class="active">Ввод данных</button>
        <button id="controlTabBtn">Контроль</button>
      </div>

      <div id="lanes" class="lanes"></div>
      <p class="hint" id="controlEmptyHint" style="display:none;text-align:center;">
        Сначала внесите номера участников на вкладке «Ввод данных»
      </p>

      <div class="saved" id="savedSection" style="display:none;">
        <div class="saved-header">
          <div class="saved-title">Сохранённые забеги</div>
          <button class="btn" id="downloadAll">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            <span>Скачать все</span>
          </button>
        </div>
        <div class="saved-list" id="savedList"></div>
      </div>
    </div>
  </div>

  <div class="top-fixed-left">
    <button id="gsToggle" class="icon-btn" aria-label="Отправка в Google">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10.5a3.7 3.7 0 0 0 .4-7.38A5.3 5.3 0 0 0 7.4 8.1 3.8 3.8 0 0 0 7 18Z"/></svg>
    </button>
    <span class="fixed-label">Google</span>
  </div>
  <div class="top-fixed-right">
    <span class="fixed-label">Тема</span>
    <button id="themeToggle" class="icon-btn" aria-label="Переключить тему" title="Светлая/тёмная тема"></button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxxCwacsbrGH8NC-7kR2VatIREHMqzGIIzT_8B02EzbyAd-g_hKKLifOr9agaaf26swug/exec';

  // ---------- иконки (тот же линейный стиль, что и в "Приёме нормативов") ----------
  function icon(inner){
    return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }
  const SUN_ICON = icon('<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.3" x2="12" y2="4.7"/><line x1="12" y1="19.3" x2="12" y2="21.7"/><line x1="4.1" y1="4.1" x2="5.8" y2="5.8"/><line x1="18.2" y1="18.2" x2="19.9" y2="19.9"/><line x1="2.3" y1="12" x2="4.7" y2="12"/><line x1="19.3" y1="12" x2="21.7" y2="12"/><line x1="4.1" y1="19.9" x2="5.8" y2="18.2"/><line x1="18.2" y1="5.8" x2="19.9" y2="4.1"/>');
  const MOON_ICON = icon('<path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8Z"/>');

  // ---------- Тема (общая с "Приёмом нормативов" — тот же ключ localStorage) ----------
  const THEME_KEY = 'normativy_theme_v1';
  const THEME_COLOR = { dark: '#0a0d12', light: '#f3f5f8' };
  const themeToggleEl = document.getElementById('themeToggle');
  const themeColorMetaEl = document.getElementById('themeColorMeta');

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleEl.innerHTML = theme === 'light' ? MOON_ICON : SUN_ICON;
    themeToggleEl.setAttribute('aria-label', theme === 'light' ? 'Включить тёмную тему' : 'Включить светлую тему');
    themeColorMetaEl.setAttribute('content', THEME_COLOR[theme]);
    localStorage.setItem(THEME_KEY, theme);
  }
  applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');
  themeToggleEl.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  // ---------- Тумблер отправки в Google ----------
  const gsToggle = document.getElementById('gsToggle');
  let sendToGoogle = JSON.parse(localStorage.getItem('sendToGoogle') || 'true');

  function updateGsToggleUI() {
    gsToggle.classList.toggle('active', sendToGoogle);
    gsToggle.title = sendToGoogle ? 'Отправка в Google: ВКЛ' : 'Отправка в Google: ВЫКЛ';
  }
  updateGsToggleUI();

  gsToggle.addEventListener('click', () => {
    sendToGoogle = !sendToGoogle;
    localStorage.setItem('sendToGoogle', JSON.stringify(sendToGoogle));
    updateGsToggleUI();
  });

  // ---------- Тосты ----------
  const toastContainer = document.getElementById('toastContainer');
  function showToast(message, type){
    const t = document.createElement('div');
    t.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    t.textContent = message;
    toastContainer.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 300);
    }, 3200);
  }

  // ---------- Индикатор соединения (точка в тулбаре) ----------
  const connDot = document.getElementById('connDot');
  function setConnStatus(ok){
    connDot.classList.remove('ok','err');
    connDot.classList.add(ok ? 'ok' : 'err');
  }

  // === Таймер ===
  let running = false;
  let stopped = false;
  let baseTime = 0;
  let offset = 0;
  let timerInterval = null;
  let lanesInterval = null;

  const timerEl = document.getElementById('timer');
  const totalLapsInput = document.getElementById('totalLaps');
  const raceNameInput = document.getElementById('raceName');
  const lanesEl = document.getElementById('lanes');
  const controlEmptyHint = document.getElementById('controlEmptyHint');

  // === Вкладки "Ввод данных" / "Контроль" ===
  const VIEW_MODE_KEY = 'lapCounterViewMode';
  let viewMode = localStorage.getItem(VIEW_MODE_KEY) === 'control' ? 'control' : 'setup';
  const setupTabBtn = document.getElementById('setupTabBtn');
  const controlTabBtn = document.getElementById('controlTabBtn');

  function setViewMode(mode){
    viewMode = mode;
    localStorage.setItem(VIEW_MODE_KEY, mode);
    setupTabBtn.classList.toggle('active', mode === 'setup');
    controlTabBtn.classList.toggle('active', mode === 'control');
    renderLanes();
  }
  setupTabBtn.addEventListener('click', () => setViewMode('setup'));
  controlTabBtn.addEventListener('click', () => setViewMode('control'));

  const lanes = Array.from({length:10}, () => ({
    athlete: '',
    bib: '',
    laps: [],
    finished: false
  }));

  const SAVED_RUNS_KEY = 'savedRunsV1';
  let savedRuns = JSON.parse(localStorage.getItem(SAVED_RUNS_KEY) || '[]');

  function fmt(ms){
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    const cs = Math.floor((ms%1000)/10).toString().padStart(2,'0');
    return `${m}:${sec}:${cs}`;
  }
  function elapsed(){
    return running ? offset + (performance.now() - baseTime) : offset;
  }
  function formatLap(ms){
    const ts = Math.floor(ms/1000);
    const mm = Math.floor(ts/60).toString().padStart(2,'0');
    const ss = (ts%60).toString().padStart(2,'0');
    return `${mm}:${ss}`;
  }
  function formatTotal(ms){
    const s = Math.floor(ms/1000);
    const h = Math.floor(s/3600).toString().padStart(2,'0');
    const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
    const ss = (s%60).toString().padStart(2,'0');
    return `${h}:${m}:${ss}`;
  }

  // === Отрисовка дорожек ===
  function renderLanes(){
    const totalLaps = parseInt(totalLapsInput.value) || 1;
    const now = elapsed();
    lanesEl.innerHTML = '';
    lanesEl.classList.toggle('control-mode', viewMode === 'control');

    let shown = 0;

    lanes.forEach((lane, index) => {
      const hasData = lane.bib.trim() !== '' && lane.athlete.trim() !== '';

      // В режиме "Контроль" показываем только назначенные дорожки — так помещается больше и нечем промахнуться
      if (viewMode === 'control' && !hasData) return;

      let cls = 'lane-card';
      let state = 'idle';
      let stateLabel = hasData ? 'Готов' : 'Ожидание';
      if (lane.finished) {
        state = 'finished';
        stateLabel = 'Финиш';
        cls += ' finished';
      } else if (hasData && lane.laps.length > 0) {
        if (lane.laps.length === totalLaps - 1) {
          state = 'last-lap';
          stateLabel = 'Последний круг';
          cls += ' last-lap';
        } else {
          state = 'running';
          stateLabel = 'Бежит';
          cls += ' running';
        }
      }

      let totalMs;
      if (lane.finished) {
        totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
      } else if (running) {
        totalMs = now;
      } else {
        totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
      }

      const card = document.createElement('div');
      card.addEventListener('click', () => markLap(index));
      shown++;

      if (viewMode === 'control') {
        card.className = cls + ' ctrl-card';
        card.innerHTML = `
          <div class="ctrl-bib">${lane.bib}</div>
          <div class="ctrl-laps"><b>${lane.laps.length}</b>/${totalLaps}</div>
          ${lane.finished ? '<div class="finish-ribbon">Финиш</div>' : ''}
        `;
        lanesEl.appendChild(card);
        return;
      }

      card.className = cls;
      const hint = lane.finished ? 'Дистанция завершена' : 'Тап по карточке — круг';

      card.innerHTML = `
        <input class="bib-input" maxlength="2" placeholder="00" value="${lane.bib || ''}">
        <div class="lane-meta">
          <span class="eyebrow">${lane.laps.length}/${totalLaps}</span>
          ${lane.finished ? '' : `<span class="status-pill ${state}">${stateLabel}</span>`}
        </div>
        <div class="lane-time">${formatTotal(totalMs)}</div>
        <input class="athlete-input" placeholder="Участник" value="${lane.athlete || ''}">
        <div class="lane-footer">
          <div class="lane-hint">${hint}</div>
          <button class="undo" aria-label="Отменить круг">−1</button>
        </div>
        ${lane.finished ? '<div class="finish-ribbon">Финиш</div>' : ''}
      `;

      const athleteInput = card.querySelector('.athlete-input');
      athleteInput.addEventListener('input', e => lane.athlete = e.target.value);
      athleteInput.addEventListener('click', e => e.stopPropagation());

      const bibInput = card.querySelector('.bib-input');
      bibInput.addEventListener('input', e => {
        lane.bib = e.target.value.replace(/[^0-9]/g,'').slice(0,2);
      });
      bibInput.addEventListener('click', e => e.stopPropagation());

      card.querySelector('.undo')
        .addEventListener('click', e => { e.stopPropagation(); undoLap(index); });

      lanesEl.appendChild(card);
    });

    controlEmptyHint.style.display = (viewMode === 'control' && shown === 0) ? 'block' : 'none';
  }

  function startLanesTimer(){
    stopLanesTimer();
    lanesInterval = setInterval(() => {
      if (!running) return;
      const now = elapsed();
      lanes.forEach((lane, index) => {
        const card = lanesEl.children[index];
        if (!card) return;
        const totalEl = card.querySelector('.lane-time');
        if (!totalEl) return;
        if (!lane.finished) {
          totalEl.textContent = formatTotal(now);
        } else {
          const finalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
          totalEl.textContent = formatTotal(finalMs);
        }
      });
    }, 100);
  }
  function stopLanesTimer(){
    if (lanesInterval) {
      clearInterval(lanesInterval);
      lanesInterval = null;
    }
  }

  // === Управление таймером ===
  function startTimer(){
    if (running || stopped) return;
    baseTime = performance.now();
    running = true;
    timerInterval = setInterval(() => {
      timerEl.textContent = fmt(elapsed());
    }, 50);
    startLanesTimer();
  }
  function pauseTimer(){
    if (!running) return;
    running = false;
    offset = elapsed();
    clearInterval(timerInterval);
    stopLanesTimer();
  }
  function stopTimer(){
    if (stopped) return;
    offset = elapsed();
    running = false;
    stopped = true;
    clearInterval(timerInterval);
    stopLanesTimer();
    timerEl.textContent = fmt(elapsed());
    saveRun();
  }
  function resetTimer(){
    running = false;
    stopped = false;
    offset = 0;
    clearInterval(timerInterval);
    stopLanesTimer();
    lanes.forEach(l => { l.laps = []; l.finished = false; });
    timerEl.textContent = fmt(0);
    renderLanes();
  }

  // === Логика кругов ===
  function markLap(index){
    if (!running) return;
    const lane = lanes[index];
    if (lane.finished) return;
    const t = elapsed();
    lane.laps.push(t);
    const totalLaps = parseInt(totalLapsInput.value) || 1;
    if (lane.laps.length >= totalLaps) {
      lane.finished = true;
    }
    const card = lanesEl.children[index];
    if (card) {
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 500);
    }
    renderLanes();
  }

  function undoLap(index){
    const lane = lanes[index];
    if (!lane.laps.length) return;
    lane.laps.pop();
    lane.finished = false;
    renderLanes();
  }

  // === Имена забегов ===
  function nextDefaultName(){
    let maxN = 0;
    (savedRuns || []).forEach(r => {
      const m = String(r.name||'').match(/^Забег\s+(\d+)$/);
      if (m) {
        const n = parseInt(m[1]);
        if (n > maxN) maxN = n;
      }
    });
    return `Забег ${maxN+1}`;
  }

  // === Отправка в Google Sheets (по номеру участника) ===
  async function sendToGoogleSheet(run){
    try{
      const payload = {
        entries: run.entries
          .filter(e => (e.athlete||'').trim().length)
          .map(e => ({
            bib: String(e.athlete).trim(), // номер участника = столбец A
            total: e.total
          }))
      };
      if(!payload.entries.length) return;
      await fetch(scriptURL, {
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      setConnStatus(true);
    }catch(err){
      setConnStatus(false);
      console.error('Ошибка отправки в Google:', err);
    }
  }

  // === Сохранение забега ===
  function saveRun(){
    const entries = [];
    lanes.forEach(lane => {
      if (!lane.athlete.trim()) return;
      const totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : elapsed();
      entries.push({
        bib: lane.bib || '',
        athlete: lane.athlete.trim(),
        laps: lane.laps.map((v,i)=>formatLap(v-(lane.laps[i-1]||0))),
        total: formatTotal(totalMs)
      });
    });
    if (!entries.length) {
      showToast('Нет данных для сохранения — укажите номера спортсменов', 'error');
      return;
    }
    const id = Date.now();
    const created = new Date();
    const name = (raceNameInput.value && raceNameInput.value.trim())
      ? raceNameInput.value.trim()
      : nextDefaultName();

    const run = {
      id,
      name,
      createdAt: created.toISOString(),
      totalLaps: parseInt(totalLapsInput.value)||1,
      entries
    };
    savedRuns.push(run);
    localStorage.setItem(SAVED_RUNS_KEY, JSON.stringify(savedRuns));
    renderSavedRuns();
    showToast(`Забег «${name}» сохранён`, 'success');
    if (sendToGoogle) {
      sendToGoogleSheet(run);
    }
  }

  // === UI сохранённых забегов ===
  function escapeHtml(s){
    return s.replace(/[&<>\"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function renderSavedRuns(){
    const section = document.getElementById('savedSection');
    const list = document.getElementById('savedList');
    list.innerHTML = '';
    if (!savedRuns.length) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';

    savedRuns.slice().reverse().forEach(run => {
      const d = new Date(run.createdAt);
      const dateStr = d.toLocaleDateString('ru-RU');
      const timeStr = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const item = document.createElement('div');
      item.className = 'saved-item';
      item.innerHTML = `
        <div class="saved-meta"><strong>${escapeHtml(run.name)}</strong> · ${dateStr} ${timeStr}</div>
        <div class="saved-buttons">
          <button class="btn" data-act="dl">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            <span>Скачать</span>
          </button>
          <button class="btn" data-act="rm">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/></svg>
            <span>Удалить</span>
          </button>
        </div>
      `;
      item.querySelector('[data-act="dl"]')
        .addEventListener('click', () => downloadRun(run));
      item.querySelector('[data-act="rm"]')
        .addEventListener('click', () => {
          if (confirm('Удалить этот забег?')) deleteRun(run.id);
        });
      list.appendChild(item);
    });
  }

  function downloadRun(run){
    const maxLaps = Math.max(...run.entries.map(e=>e.laps.length));
    const headers = ['Манишка','Спортсмен'];
    for(let i=1;i<=maxLaps;i++) headers.push('Круг '+i);
    headers.push('Итог');

    const rows = [headers];
    run.entries.forEach(e => {
      const row = [e.bib, e.athlete];
      for(let i=0;i<maxLaps;i++) row.push(e.laps[i]||'');
      row.push(e.total);
      rows.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    const sheetName = (run.name||'Забег').substring(0,31) || 'Забег';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const d = new Date(run.createdAt);
    const fname = `${run.name||'Забег'} — ${d.toLocaleDateString('ru-RU')} ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}.xlsx`;
    XLSX.writeFile(wb, fname);
  }

  document.getElementById('downloadAll').addEventListener('click', () => {
    if (!savedRuns.length) {
      showToast('Нет сохранённых забегов', 'error');
      return;
    }
    const wb = XLSX.utils.book_new();
    savedRuns.forEach((run, idx) => {
      const maxLaps = Math.max(...run.entries.map(e=>e.laps.length));
      const headers = ['Манишка','Спортсмен'];
      for(let i=1;i<=maxLaps;i++) headers.push('Круг '+i);
      headers.push('Итог');
      const rows = [headers];
      run.entries.forEach(e => {
        const row = [e.bib, e.athlete];
        for(let i=0;i<maxLaps;i++) row.push(e.laps[i]||'');
        row.push(e.total);
        rows.push(row);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const sheetName = ((idx+1)+" - "+(run.name||'Забег')).substring(0,31);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
    XLSX.writeFile(wb, 'Все забеги.xlsx');
  });

  function deleteRun(id){
    savedRuns = savedRuns.filter(r => r.id !== id);
    localStorage.setItem(SAVED_RUNS_KEY, JSON.stringify(savedRuns));
    renderSavedRuns();
  }

  // === Инициализация ===
  function init(){
    timerEl.textContent = fmt(0);
    setupTabBtn.classList.toggle('active', viewMode === 'setup');
    controlTabBtn.classList.toggle('active', viewMode === 'control');
    renderLanes();
    renderSavedRuns();
  }

  document.getElementById('startBtn').addEventListener('click', startTimer);
  document.getElementById('pauseBtn').addEventListener('click', pauseTimer);
  document.getElementById('stopBtn').addEventListener('click', stopTimer);
  document.getElementById('resetBtn').addEventListener('click', resetTimer);

  init();
</script>
</body>
</html>
