<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Счётчик кругов — Трек & Поле</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box }

    :root {
      --bg1:#0a0e17; --bg2:#131b2c; --text:#f2f5fa; --muted:#96a1ba;
      --brand:#5ab7ff; --brand-2:#8cd3ff; --ok:#5eead4; --warn:#facc15; --danger:#ff7a7a;
      --card-top:#232f52; --card-bot:#151d34;
      --card-border: rgba(255,255,255,.08);
      --card-highlight: rgba(255,255,255,.06);
      --shadow: 0 10px 24px rgba(0,0,0,.45);
      --ctrl-text:#f2f5fa;
      --header-h: 210px;
    }

    /* LIGHT: сине-стеклянная тема */
    body.light {
      --bg1:#e7f0ff; --bg2:#d9e3f6; --text:#0f172a; --muted:#586174;
      --brand:#1d75ff; --brand-2:#3b82f6; --ok:#0f9d72; --warn:#b45309; --danger:#dc2626;
      --card-top:#ffffff; --card-bot:#eef3ff;
      --card-border: rgba(15,23,42,.08);
      --card-highlight: rgba(255,255,255,.9);
      --shadow: 0 14px 30px rgba(15,23,42,.12);
      --ctrl-text:#0f172a;
      background:radial-gradient(circle at 0% 0%,#eef4ff 0,#e2ebff 32%,#d7e4ff 60%,#d3ddf5 100%);
    }

    html, body { height:100%; margin:0; overflow:hidden; }
    html { -webkit-text-size-adjust:100%; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
    }

    /* Единый "стеклянный" стиль поверхностей — без backdrop-filter,
       чтобы одинаково хорошо и быстро работало на слабом железе (iPad 2). */
    header, .lane-card, .saved {
      background:linear-gradient(180deg,var(--card-top),var(--card-bot));
      border:1px solid var(--card-border);
      box-shadow:var(--shadow), inset 0 1px 0 var(--card-highlight);
    }

    header {
      position:fixed; top:0; left:0; right:0; z-index:100;
      border-radius:0;
      border-left:none; border-right:none; border-top:none;
      text-align:center;
      padding:10px 10px 12px;
    }

    .header-inner {
      display:flex; justify-content:center; align-items:center;
      position:relative;
      margin-bottom:14px;
    }

    /* Тумблеры (Google / Тема) — увеличены под палец (56x30, как системный UISwitch) */
    .gs-toggle, .theme-toggle {
      position:absolute;
      width:56px; height:30px;
      border-radius:15px;
      cursor:pointer;
      touch-action:manipulation;
      background:rgba(148,163,184,.28);
      box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
    }
    .gs-toggle { left:6px; }
    .theme-toggle { right:6px; }

    .toggle-icon {
      position:absolute; top:50%; transform:translateY(-50%);
      width:14px; height:14px; color:var(--muted);
      pointer-events:none;
      transition:opacity .2s;
    }
    .gs-toggle .toggle-icon { left:8px; }
    .theme-toggle .icon-moon { left:8px; opacity:.9; }
    .theme-toggle .icon-sun { right:8px; opacity:.35; }
    body.light .theme-toggle .icon-moon { opacity:.35; }
    body.light .theme-toggle .icon-sun { opacity:.9; }

    .gs-toggle-knob, .theme-toggle-knob {
      position:absolute; top:4px; left:4px;
      width:22px; height:22px;
      border-radius:50%;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      transition:.25s;
      z-index:2;
    }
    .gs-toggle-knob { background:#e5e7eb; }
    .theme-toggle-knob { background:var(--text); }

    .gs-toggle.active { background:rgba(56,189,248,.85); }
    .gs-toggle.active .gs-toggle-knob { transform:translateX(26px); background:#f9fafb; }
    .gs-toggle.active .toggle-icon { color:#06121f; }

    body.light .theme-toggle-knob { background:#0f172a; }
    body.light .theme-toggle .theme-toggle-knob { transform:translateX(26px); }

    .timer {
      font-weight:900;
      font-size:clamp(30px,7vw,56px);
      color:var(--brand);
      text-shadow:0 0 16px rgba(90,183,255,.5);
      letter-spacing:1px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display:flex; justify-content:center;
      flex-wrap:wrap; gap:8px;
      margin-top:4px;
      margin-bottom:14px;
    }

    button, input {
      border:none; outline:none;
      border-radius:12px;
      font-weight:700;
      font-family:inherit;
      transition:.2s;
      -webkit-appearance:none;
    }
    button {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:44px;
      padding:0 16px;
      font-size:14px;
      background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
      color:var(--ctrl-text);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.25),
                 0 2px 8px rgba(0,0,0,.35);
      cursor:pointer;
      touch-action:manipulation;
    }
    button svg { margin-right:6px; flex-shrink:0; }
    button:active { transform:translateY(1px); }
    .btn-primary {
      background:linear-gradient(180deg,var(--brand),var(--brand-2));
      color:#06121f;
    }
    .btn-danger {
      background:linear-gradient(180deg,var(--danger),#ffb3b3);
      color:#170606;
    }
    body.light button {
      border-radius:999px;
      background:linear-gradient(145deg,rgba(255,255,255,0.9),rgba(226,232,255,0.85));
      border:1px solid rgba(148,163,184,0.3);
      box-shadow:
        0 6px 14px rgba(15,23,42,0.12),
        inset 0 1px 0 rgba(255,255,255,0.85);
      color:#0f172a;
    }
    @media (hover:hover) and (pointer:fine) {
      body.light button:hover{
        box-shadow:
          0 10px 24px rgba(15,23,42,0.16),
          inset 0 1px 0 rgba(255,255,255,0.9);
        transform:translateY(-1px);
      }
    }

    main {
      margin-top:var(--header-h);
      height:calc(100% - var(--header-h));
      overflow-y:auto;
      -webkit-overflow-scrolling:touch; /* плавный инерционный скролл на старом iOS */
      padding:8px;
    }
    body.light main{
      background:radial-gradient(circle at 10% 0,#f5f7ff 0,#e4edff 40%,#d6e2ff 100%);
    }

    .row {
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
    }
    .row .field {
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .text-input {
      flex:0 1 480px;
      max-width:100%;
      min-height:44px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      color:var(--text);
      font-size:16px; /* >=16px — иначе Safari на iOS зумит страницу при фокусе */
    }
    body.light .text-input {
      background:rgba(255,255,255,0.92);
      border-radius:18px;
      border:1px solid rgba(148,163,184,0.35);
      box-shadow:
        0 6px 14px rgba(15,23,42,0.08),
        inset 0 1px 0 rgba(255,255,255,0.85);
      color:#0f172a;
    }
    body.light .text-input::placeholder{
      color:rgba(148,163,184,0.9);
    }

    .lanes {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:8px;
      margin-top:8px;
    }

    .lane-card {
      border-radius:18px;
      padding:10px;
      text-align:center;
      position:relative;
      overflow:hidden;
      transition:box-shadow .15s ease-out, transform .15s ease-out;
    }
    @media (hover:hover) and (pointer:fine) {
      body.light .lane-card:hover{
        transform:translateY(-2px);
      }
    }

    .lane-top {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:2px;
    }

    .badge {
      background:rgba(255,255,255,.1);
      padding:4px 10px;
      border-radius:12px;
      font-size:13px;
      font-weight:800;
      color:var(--brand);
    }
    body.light .badge{
      background:rgba(219,234,254,0.96);
      color:#1d4ed8;
    }

    .status-pill {
      display:inline-flex; align-items:center;
      font-size:10px; font-weight:800; letter-spacing:.4px;
      padding:4px 9px; border-radius:999px;
      background:rgba(255,255,255,.08);
      color:var(--muted);
      white-space:nowrap;
    }
    .status-pill::before {
      content:''; width:6px; height:6px; border-radius:50%;
      background:currentColor; margin-right:5px; flex-shrink:0;
    }
    .status-pill.running { color:var(--warn); background:rgba(250,204,21,.15); }
    .status-pill.last-lap { color:var(--danger); background:rgba(255,122,122,.15); }
    .status-pill.finished { color:var(--ok); background:rgba(94,234,212,.15); }
    body.light .status-pill { background:rgba(148,163,184,.16); }
    body.light .status-pill.running { background:rgba(180,83,9,.14); }
    body.light .status-pill.last-lap { background:rgba(220,38,38,.12); }
    body.light .status-pill.finished { background:rgba(15,157,114,.14); }

    .lane-time {
      font-weight:900;
      font-size:clamp(22px,6vw,32px);
      color:var(--brand);
      text-shadow:0 0 10px rgba(90,183,255,.3);
      margin:8px 0 10px;
      font-variant-numeric: tabular-nums;
    }
    body.light .lane-time{
      color:#1d4ed8;
      text-shadow:0 0 14px rgba(59,130,246,0.3);
    }

    .lane-identity {
      display:flex;
      align-items:stretch;
    }
    .bib-input {
      flex:0 0 56px;
      width:56px; height:44px;
      margin-right:8px;
      text-align:center;
      font-size:20px;
      font-weight:900;
      border-radius:12px;
      border:2px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
      color:var(--text);
    }
    body.light .bib-input{
      background:rgba(255,255,255,0.96);
      border:1px solid rgba(148,163,184,0.55);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
      color:#111827;
    }

    .athlete-input {
      flex:1 1 auto;
      min-width:0; /* иначе flex-элемент не сжимается меньше текста плейсхолдера и вылезает за карточку */
      height:44px;
      padding:0 8px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      color:var(--text);
      font-size:16px; /* >=16px — иначе Safari на iOS зумит страницу при фокусе */
      text-align:center;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    body.light .athlete-input{
      background:rgba(255,255,255,0.96);
      border:1px solid rgba(148,163,184,0.45);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
      color:#111827;
    }

    .lane-footer {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      color:var(--muted);
      font-size:10px;
      line-height:1.3;
    }
    .lane-hint { flex:1; text-align:left; margin-right:8px; }
    .undo {
      flex-shrink:0;
      min-height:36px; min-width:44px;
      padding:6px 10px;
      border-radius:10px;
      background:rgba(255,255,255,.15);
      color:var(--text);
      font-size:13px;
      touch-action:manipulation;
    }
    body.light .undo{
      background:rgba(226,232,240,0.95);
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.6);
      color:#111827;
    }

    .finish-ribbon {
      position:absolute;
      top:14px; right:-34px;
      width:130px;
      transform:rotate(45deg);
      background:linear-gradient(180deg,#22c55e,#16a34a);
      color:#04140b;
      font-weight:900;
      font-size:11px;
      letter-spacing:1.5px;
      text-align:center;
      padding:4px 0;
      box-shadow:0 4px 10px rgba(0,0,0,.35);
    }
    body.light .finish-ribbon {
      background:linear-gradient(180deg,#4ade80,#16a34a);
      color:#052e16;
    }

    /* Жёлтая подсветка – дорожка бежит */
    .lane-card.running {
      box-shadow:
        var(--shadow), inset 0 1px 0 var(--card-highlight),
        0 8px 18px rgba(250,204,21,.5);
    }
    /* Красная подсветка – последний круг */
    .lane-card.last-lap {
      box-shadow:
        var(--shadow), inset 0 1px 0 var(--card-highlight),
        0 8px 18px rgba(239,68,68,.5);
    }
    .lane-card.finished {
      box-shadow:
        var(--shadow), inset 0 1px 0 var(--card-highlight),
        0 8px 18px rgba(34,197,94,.35);
    }

    .lane-card.flash {
      animation: flashGlow .5s ease-out;
    }
    @keyframes flashGlow {
      0%{box-shadow:var(--shadow),0 0 0 0 rgba(90,183,255,.7);}
      60%{box-shadow:var(--shadow),0 0 22px 10px rgba(90,183,255,.28);}
      100%{box-shadow:var(--shadow);}
    }

    .saved {
      margin-top:14px;
      border-radius:18px;
      padding:14px;
    }
    .saved-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }
    .saved-title { font-weight:900; font-size:18px; }
    .saved-actions { display:flex; gap:8px; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:40px;
      padding:0 14px;
      border-radius:12px;
      font-weight:800;
      font-size:13px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      color:var(--text);
      cursor:pointer;
      touch-action:manipulation;
    }
    .btn svg { margin-right:6px; flex-shrink:0; }
    body.light .btn{
      border-radius:999px;
      background:linear-gradient(145deg,rgba(255,255,255,0.96),rgba(226,232,255,0.9));
      border:1px solid rgba(148,163,184,0.45);
      box-shadow:
        0 6px 14px rgba(15,23,42,0.12),
        inset 0 1px 0 rgba(255,255,255,0.9);
      color:#0f172a;
    }
    .saved-list { display:grid; gap:8px; }
    .saved-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
      padding:12px;
      border-radius:14px;
      background:rgba(0,0,0,.18);
    }
    body.light .saved-item{
      background:rgba(248,250,252,0.95);
      border-radius:16px;
      border:1px solid rgba(209,213,219,0.9);
    }
    .saved-meta { font-weight:700; font-size:13px; }
    .saved-buttons { display:flex; gap:8px; }

    @media (min-width:900px) {
      .lanes{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    }

    /* ===== Компактный режим для телефонов — верхняя панель и карточки заметно легче ===== */
    @media (max-width:480px) {
      header { padding:8px 8px 10px; }
      .header-inner { margin-bottom:8px; }
      .timer { font-size:clamp(24px,9vw,34px); }

      .controls { gap:6px; margin-top:2px; margin-bottom:8px; }
      .controls button {
        min-height:38px;
        padding:0 10px;
        font-size:12px;
        border-radius:10px;
      }
      .controls button svg { width:13px; height:13px; margin-right:4px; }

      .row { gap:6px; }
      .row .field { gap:6px; }
      .row label { font-size:13px; }
      .text-input { min-height:38px; padding:6px 10px; }

      .lanes {
        gap:6px;
        margin-top:6px;
        grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
      }
      .lane-card { padding:8px; border-radius:14px; }
      .lane-time { font-size:clamp(18px,7vw,26px); margin:6px 0 8px; }
      .bib-input { flex:0 0 46px; width:46px; height:38px; font-size:17px; margin-right:6px; }
      .athlete-input { height:38px; padding:0 6px; }
      .lane-footer { font-size:9px; margin-top:8px; }
      .lane-hint { margin-right:6px; }
      .undo { min-height:32px; min-width:38px; padding:5px 8px; font-size:12px; }
    }

    /* ===== Фолбэки для старых WebKit без CSS Grid / gap (Safari iOS ≤ 9.3, iPad 2) ===== */
    @supports not (display: grid) {
      .lanes {
        display:flex;
        flex-wrap:wrap;
        margin:-4px;
      }
      .lanes > .lane-card {
        flex:1 1 180px;
        min-width:180px;
        margin:4px;
      }
    }
    @supports not (gap: 1px) {
      .controls > * { margin:3px; }
      .row .field { margin-bottom:8px; }
      .row .field > * { margin:0 4px 4px 0; }
      .saved-header > * { margin:0 4px; }
      .saved-actions > * { margin:0 4px; }
      .saved-list > * { margin-bottom:8px; }
      .saved-item > * { margin:0 4px 4px 0; }
      .saved-buttons > * { margin:0 4px; }
    }
  </style>
</head>
<body>
<header id="appHeader">
  <div class="header-inner">
    <div class="gs-toggle" id="gsToggle" title="Отправка в Google">
      <svg class="toggle-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 8.1 4 4 0 0 0 7 18z"/></svg>
      <div class="gs-toggle-knob"></div>
    </div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="theme-toggle" id="themeToggle" title="Тема">
      <svg class="toggle-icon icon-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="toggle-icon icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
          <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/>
        </g>
      </svg>
      <div class="theme-toggle-knob"></div>
    </div>
  </div>
  <div class="controls">
    <button id="startBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
      <span>Старт</span>
    </button>
    <button id="pauseBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
      <span>Пауза</span>
    </button>
    <button id="stopBtn" class="btn-danger">
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
      <span>Стоп</span>
    </button>
    <button id="resetBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v6h6"/><path d="M21 21v-6h-6"/><path d="M4 15a8 8 0 0 0 14 5 8 8 0 0 0-1-13.5L15 9"/>
      </svg>
      <span>Сброс</span>
    </button>
  </div>
  <div class="row">
    <div class="field">
      <label for="totalLaps">Круги:</label>
      <input type="number" id="totalLaps" min="1" value="5"
             class="text-input" style="max-width:120px" />
    </div>
    <div class="field">
      <label for="raceName">Название забега:</label>
      <input type="text" id="raceName"
             class="text-input"
             placeholder="Например: Финал 800м" />
    </div>
  </div>
</header>

<main>
  <section id="lanes" class="lanes"></section>

  <section class="saved" id="savedSection" style="display:none;">
    <div class="saved-header">
      <div class="saved-title">Сохранённые забеги</div>
      <div class="saved-actions">
        <button class="btn" id="downloadAll">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Скачать все</span>
        </button>
      </div>
    </div>
    <div class="saved-list" id="savedList"></div>
  </section>
</main>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxxCwacsbrGH8NC-7kR2VatIREHMqzGIIzT_8B02EzbyAd-g_hKKLifOr9agaaf26swug/exec';

  // === Тема ===
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (savedTheme === 'light') document.body.classList.add('light');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem(
      'theme',
      document.body.classList.contains('light') ? 'light' : 'dark'
    );
  });

  // === Тумблер отправки в Google ===
  const gsToggle = document.getElementById('gsToggle');
  let sendToGoogle = JSON.parse(localStorage.getItem('sendToGoogle') || 'true');

  function updateGsToggleUI() {
    if (sendToGoogle) {
      gsToggle.classList.add('active');
      gsToggle.title = 'Отправка в Google: ВКЛ';
    } else {
      gsToggle.classList.remove('active');
      gsToggle.title = 'Отправка в Google: ВЫКЛ';
    }
  }
  updateGsToggleUI();

  gsToggle.addEventListener('click', () => {
    sendToGoogle = !sendToGoogle;
    localStorage.setItem('sendToGoogle', JSON.stringify(sendToGoogle));
    updateGsToggleUI();
  });

  // === Динамическая высота шапки ===
  function adjustLayout(){
    const h = document.getElementById('appHeader').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }
  window.addEventListener('resize', adjustLayout);
  window.addEventListener('orientationchange', adjustLayout);

  // === Таймер ===
  let running = false;
  let stopped = false;
  let baseTime = 0;
  let offset = 0;
  let timerInterval = null;
  let lanesInterval = null;

  const timerEl = document.getElementById('timer');
  const totalLapsInput = document.getElementById('totalLaps');
  const raceNameInput = document.getElementById('raceName');
  const lanesEl = document.getElementById('lanes');

  const lanes = Array.from({length:10}, () => ({
    athlete: '',
    bib: '',
    laps: [],
    finished: false
  }));

  const SAVED_RUNS_KEY = 'savedRunsV1';
  let savedRuns = JSON.parse(localStorage.getItem(SAVED_RUNS_KEY) || '[]');

  function fmt(ms){
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    const cs = Math.floor((ms%1000)/10).toString().padStart(2,'0');
    return `${m}:${sec}:${cs}`;
  }
  function elapsed(){
    return running ? offset + (performance.now() - baseTime) : offset;
  }
  function formatLap(ms){
    const ts = Math.floor(ms/1000);
    const mm = Math.floor(ts/60).toString().padStart(2,'0');
    const ss = (ts%60).toString().padStart(2,'0');
    return `${mm}:${ss}`;
  }
  function formatTotal(ms){
    const s = Math.floor(ms/1000);
    const h = Math.floor(s/3600).toString().padStart(2,'0');
    const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
    const ss = (s%60).toString().padStart(2,'0');
    return `${h}:${m}:${ss}`;
  }

  // === Отрисовка дорожек ===
  function renderLanes(){
    const totalLaps = parseInt(totalLapsInput.value) || 1;
    const now = elapsed();
    lanesEl.innerHTML = '';

    lanes.forEach((lane, index) => {
      const card = document.createElement('div');

      let cls = 'lane-card';
      const hasData = lane.bib.trim() !== '' && lane.athlete.trim() !== '';

      let state = 'idle';
      let stateLabel = hasData ? 'Готов' : 'Ожидание';
      if (lane.finished) {
        state = 'finished';
        stateLabel = 'Финиш';
        cls += ' finished';
      } else if (hasData && lane.laps.length > 0) {
        if (lane.laps.length === totalLaps - 1) {
          state = 'last-lap';
          stateLabel = 'Последний круг';
          cls += ' last-lap';
        } else {
          state = 'running';
          stateLabel = 'Бежит';
          cls += ' running';
        }
      }
      card.className = cls;

      card.addEventListener('click', () => markLap(index));

      let totalMs;
      if (lane.finished) {
        totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
      } else if (running) {
        totalMs = now;
      } else {
        totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
      }

      const hint = lane.finished ? 'Дистанция завершена' : 'Тап по карточке — круг';

      card.innerHTML = `
        <div class="lane-top">
          <span class="badge">${lane.laps.length}/${totalLaps}</span>
          ${lane.finished ? '' : `<span class="status-pill ${state}">${stateLabel}</span>`}
        </div>
        <div class="lane-time">${formatTotal(totalMs)}</div>
        <div class="lane-identity">
          <input class="bib-input" maxlength="2" placeholder="00" value="${lane.bib || ''}">
          <input class="athlete-input" placeholder="Участник" value="${lane.athlete || ''}">
        </div>
        <div class="lane-footer">
          <div class="lane-hint">${hint}</div>
          <button class="undo" aria-label="Отменить круг">−1</button>
        </div>
        ${lane.finished ? '<div class="finish-ribbon">ФИНИШ</div>' : ''}
      `;

      const athleteInput = card.querySelector('.athlete-input');
      athleteInput.addEventListener('input', e => lane.athlete = e.target.value);
      athleteInput.addEventListener('click', e => e.stopPropagation());

      const bibInput = card.querySelector('.bib-input');
      bibInput.addEventListener('input', e => {
        lane.bib = e.target.value.replace(/[^0-9]/g,'').slice(0,2);
      });
      bibInput.addEventListener('click', e => e.stopPropagation());

      card.querySelector('.undo')
        .addEventListener('click', e => { e.stopPropagation(); undoLap(index); });

      lanesEl.appendChild(card);
    });
  }

  function startLanesTimer(){
    stopLanesTimer();
    lanesInterval = setInterval(() => {
      if (!running) return;
      const now = elapsed();
      lanes.forEach((lane, index) => {
        const card = lanesEl.children[index];
        if (!card) return;
        const totalEl = card.querySelector('.lane-time');
        if (!totalEl) return;
        if (!lane.finished) {
          totalEl.textContent = formatTotal(now);
        } else {
          const finalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : 0;
          totalEl.textContent = formatTotal(finalMs);
        }
      });
    }, 100);
  }
  function stopLanesTimer(){
    if (lanesInterval) {
      clearInterval(lanesInterval);
      lanesInterval = null;
    }
  }

  // === Управление таймером ===
  function startTimer(){
    if (running || stopped) return;
    baseTime = performance.now();
    running = true;
    timerInterval = setInterval(() => {
      timerEl.textContent = fmt(elapsed());
    }, 50);
    startLanesTimer();
  }
  function pauseTimer(){
    if (!running) return;
    running = false;
    offset = elapsed();
    clearInterval(timerInterval);
    stopLanesTimer();
  }
  function stopTimer(){
    if (stopped) return;
    offset = elapsed();
    running = false;
    stopped = true;
    clearInterval(timerInterval);
    stopLanesTimer();
    timerEl.textContent = fmt(elapsed());
    saveRun();
  }
  function resetTimer(){
    running = false;
    stopped = false;
    offset = 0;
    clearInterval(timerInterval);
    stopLanesTimer();
    lanes.forEach(l => { l.laps = []; l.finished = false; });
    timerEl.textContent = fmt(0);
    renderLanes();
  }

  // === Логика кругов ===
  function markLap(index){
    if (!running) return;
    const lane = lanes[index];
    if (lane.finished) return;
    const t = elapsed();
    lane.laps.push(t);
    const totalLaps = parseInt(totalLapsInput.value) || 1;
    if (lane.laps.length >= totalLaps) {
      lane.finished = true;
    }
    const card = lanesEl.children[index];
    if (card) {
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 500);
    }
    renderLanes();
  }

  function undoLap(index){
    const lane = lanes[index];
    if (!lane.laps.length) return;
    lane.laps.pop();
    lane.finished = false;
    renderLanes();
  }

  // === Имена забегов ===
  function nextDefaultName(){
    let maxN = 0;
    (savedRuns || []).forEach(r => {
      const m = String(r.name||'').match(/^Забег\s+(\d+)$/);
      if (m) {
        const n = parseInt(m[1]);
        if (n > maxN) maxN = n;
      }
    });
    return `Забег ${maxN+1}`;
  }

  // === Отправка в Google Sheets (по номеру участника) ===
  async function sendToGoogleSheet(run){
    try{
      const payload = {
        entries: run.entries
          .filter(e => (e.athlete||'').trim().length)
          .map(e => ({
            bib: String(e.athlete).trim(), // номер участника = столбец A
            total: e.total
          }))
      };
      if(!payload.entries.length) return;
      await fetch(scriptURL, {
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      console.log('✅ Отправлено в Google по номеру участника');
    }catch(err){
      console.error('Ошибка отправки в Google:', err);
    }
  }

  // === Сохранение забега ===
  function saveRun(){
    const entries = [];
    lanes.forEach(lane => {
      if (!lane.athlete.trim()) return;
      const totalMs = lane.laps.length ? lane.laps[lane.laps.length-1] : elapsed();
      entries.push({
        bib: lane.bib || '',
        athlete: lane.athlete.trim(),
        laps: lane.laps.map((v,i)=>formatLap(v-(lane.laps[i-1]||0))),
        total: formatTotal(totalMs)
      });
    });
    if (!entries.length) {
      alert('Нет данных для сохранения (укажите номера спортсменов).');
      return;
    }
    const id = Date.now();
    const created = new Date();
    const name = (raceNameInput.value && raceNameInput.value.trim())
      ? raceNameInput.value.trim()
      : nextDefaultName();

    const run = {
      id,
      name,
      createdAt: created.toISOString(),
      totalLaps: parseInt(totalLapsInput.value)||1,
      entries
    };
    savedRuns.push(run);
    localStorage.setItem(SAVED_RUNS_KEY, JSON.stringify(savedRuns));
    renderSavedRuns();
    if (sendToGoogle) {
      sendToGoogleSheet(run);
    }
  }

  // === UI сохранённых забегов ===
  function escapeHtml(s){
    return s.replace(/[&<>\"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function renderSavedRuns(){
    const section = document.getElementById('savedSection');
    const list = document.getElementById('savedList');
    list.innerHTML = '';
    if (!savedRuns.length) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';

    savedRuns.slice().reverse().forEach(run => {
      const d = new Date(run.createdAt);
      const dateStr = d.toLocaleDateString('ru-RU');
      const timeStr = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const item = document.createElement('div');
      item.className = 'saved-item';
      item.innerHTML = `
        <div class="saved-meta"><strong>${escapeHtml(run.name)}</strong> · ${dateStr} ${timeStr}</div>
        <div class="saved-buttons">
          <button class="btn" data-act="dl">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            <span>Скачать</span>
          </button>
          <button class="btn" data-act="rm">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/></svg>
            <span>Удалить</span>
          </button>
        </div>
      `;
      item.querySelector('[data-act="dl"]')
        .addEventListener('click', () => downloadRun(run));
      item.querySelector('[data-act="rm"]')
        .addEventListener('click', () => {
          if (confirm('Удалить этот забег?')) deleteRun(run.id);
        });
      list.appendChild(item);
    });
  }

  function downloadRun(run){
    const maxLaps = Math.max(...run.entries.map(e=>e.laps.length));
    const headers = ['Манишка','Спортсмен'];
    for(let i=1;i<=maxLaps;i++) headers.push('Круг '+i);
    headers.push('Итог');

    const rows = [headers];
    run.entries.forEach(e => {
      const row = [e.bib, e.athlete];
      for(let i=0;i<maxLaps;i++) row.push(e.laps[i]||'');
      row.push(e.total);
      rows.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    const sheetName = (run.name||'Забег').substring(0,31) || 'Забег';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const d = new Date(run.createdAt);
    const fname = `${run.name||'Забег'} — ${d.toLocaleDateString('ru-RU')} ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}.xlsx`;
    XLSX.writeFile(wb, fname);
  }

  document.getElementById('downloadAll').addEventListener('click', () => {
    if (!savedRuns.length) {
      alert('Нет сохранённых забегов');
      return;
    }
    const wb = XLSX.utils.book_new();
    savedRuns.forEach((run, idx) => {
      const maxLaps = Math.max(...run.entries.map(e=>e.laps.length));
      const headers = ['Манишка','Спортсмен'];
      for(let i=1;i<=maxLaps;i++) headers.push('Круг '+i);
      headers.push('Итог');
      const rows = [headers];
      run.entries.forEach(e => {
        const row = [e.bib, e.athlete];
        for(let i=0;i<maxLaps;i++) row.push(e.laps[i]||'');
        row.push(e.total);
        rows.push(row);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const sheetName = ((idx+1)+" - "+(run.name||'Забег')).substring(0,31);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
    XLSX.writeFile(wb, 'Все забеги.xlsx');
  });

  function deleteRun(id){
    savedRuns = savedRuns.filter(r => r.id !== id);
    localStorage.setItem(SAVED_RUNS_KEY, JSON.stringify(savedRuns));
    renderSavedRuns();
  }

  // === Инициализация ===
  function init(){
    adjustLayout();
    setTimeout(adjustLayout, 150);
    timerEl.textContent = fmt(0);
    renderLanes();
    renderSavedRuns();
  }

  document.getElementById('startBtn').addEventListener('click', startTimer);
  document.getElementById('pauseBtn').addEventListener('click', pauseTimer);
  document.getElementById('stopBtn').addEventListener('click', stopTimer);
  document.getElementById('resetBtn').addEventListener('click', resetTimer);

  init();
</script>
</body>
</html>
